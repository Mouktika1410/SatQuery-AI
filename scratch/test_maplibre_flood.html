<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Test MapLibre Flood</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  fetch('sample_flood.geojson')
    .then(r => r.json())
    .then(floodGeoJSON => {
      console.log('Loaded floodGeoJSON:', floodGeoJSON);
      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            'satellite-tiles': {
              type: 'raster',
              tiles: ['https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'],
              tileSize: 256,
              maxzoom: 20
            }
          },
          layers: [
            {
              id: 'satellite-basemap',
              type: 'raster',
              source: 'satellite-tiles',
              minzoom: 0,
              maxzoom: 20
            }
          ]
        },
        center: [76.4624, 9.6791],
        zoom: 13,
        pitch: 52,
        bearing: -15
      });

      map.on('load', () => {
        console.log('Map loaded!');
        map.addSource('flood-data', {
          type: 'geojson',
          data: floodGeoJSON
        });

        map.addLayer({
          id: 'flood-fill-layer',
          type: 'fill',
          source: 'flood-data',
          paint: {
            'fill-color': '#0284c7',
            'fill-opacity': 0.52
          }
        });

        map.addLayer({
          id: 'flood-outline-layer',
          type: 'line',
          source: 'flood-data',
          paint: {
            'line-color': '#00e5ff',
            'line-width': 2.8,
            'line-opacity': 0.95
          }
        });
        console.log('Layers added successfully!');
      });

      map.on('error', (e) => {
        console.error('MapLibre error:', e);
      });
    });
</script>
</body>
</html>
