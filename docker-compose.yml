services:
  db:
    image: postgis/postgis:16-3.4
    container_name: satquery_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-satquery}
      POSTGRES_USER: ${POSTGRES_USER:-satquery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satquery}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-satquery} -d ${POSTGRES_DB:-satquery}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
